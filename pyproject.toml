[project]
name = "vuln-triage-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cvss>=3.6,<3.7",
    "fastmcp>=4.1.2",
    "httpx>=0.28.1",
]

[project.urls]
Repository = "https://github.com/kimmawla/vuln-triage-mcp"
Issues = "https://github.com/kimmawla/vuln-triage-mcp/issues"

[project.scripts]
vuln-triage-mcp = "vuln_triage_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live-network tests are opt-in: `uv run pytest -m live`. CI runs offline.
addopts = "-m 'not live'"
markers = [
    "live: calls the real OSV, EPSS, and KEV APIs; skipped by default (run with -m live)",
]
